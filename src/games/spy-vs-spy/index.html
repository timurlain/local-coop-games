<!doctype html>
<html lang="cs">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Spy vs Spy</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <canvas id="game"></canvas>

    <section id="menu" class="overlay">
      <h1 id="menu-title"></h1>
      <div class="row"><label for="size" id="size-label"></label><select id="size"></select></div>
      <div class="row"><label for="clock" id="clock-label"></label><select id="clock"></select></div>
      <div class="row"><label><input type="checkbox" id="mute" /> <span id="mute-label"></span></label></div>
      <div class="slots"><div class="slot" id="slot-0"></div><div class="slot" id="slot-1"></div></div>
      <p id="menu-hint" class="hint"></p>
      <p id="controls" class="hint small"></p>
      <a href="../../../index.html" id="back"></a>
    </section>

    <section id="pause" class="overlay hidden">
      <h2 id="pause-title"></h2>
      <p id="pause-hint" class="hint"></p>
    </section>

    <section id="result" class="overlay hidden">
      <h2 id="result-title"></h2>
      <p id="result-time" class="hint"></p>
      <p id="result-seed" class="hint small"></p>
      <p id="result-hint" class="hint"></p>
    </section>

    <section id="toosmall" class="overlay hidden">
      <h2 id="toosmall-title"></h2>
    </section>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
