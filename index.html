<!doctype html>
<html lang="cs">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Hry pro dva</title>
    <style>
      :root { --bg: #14141c; --card: #22222e; --text: #eeeeee; --muted: #a0a0b0; --accent: #e8c547; }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--bg); color: var(--text); font-family: system-ui, sans-serif; }
      main { max-width: 900px; margin: 0 auto; padding: 48px 16px; }
      h1 { font-size: 40px; margin: 0 0 8px; }
      p.lead { color: var(--muted); margin: 0 0 32px; }
      ul.games { list-style: none; padding: 0; margin: 0; display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
      a.card { display: block; background: var(--card); border-radius: 12px; padding: 20px; color: inherit; text-decoration: none; border: 2px solid transparent; }
      a.card:hover, a.card:focus-visible { border-color: var(--accent); }
      a.card h2 { margin: 0 0 8px; }
      a.card p { margin: 0; color: var(--muted); }
    </style>
  </head>
  <body>
    <main>
      <h1>Hry pro dva</h1>
      <p class="lead">Lokální hry pro více hráčů u jednoho počítače. Klávesnice nebo gamepady.</p>
      <ul class="games">
        <li>
          <a class="card" href="./src/games/spy-vs-spy/index.html">
            <h2>Spy vs Spy</h2>
            <p>Dva špióni, jedna ambasáda, spousta pastí. 2 hráči, rozdělená obrazovka.</p>
          </a>
        </li>
      </ul>
    </main>
  </body>
</html>
